# Daily smoke — boots an ephemeral Postgres + the backend and runs every
# smoke script (qsign-v2 / qshield / aev / build / qcore / tier3) against
# the live HTTP surface. Catches regressions that pure unit tests miss
# because they exercise routing, middleware, env wiring and DB shape.
#
# Triggers:
#   - cron: 08:00 UTC daily
#   - workflow_dispatch with optional base_url to point at staging/prod
#   - push to main only when this file or scripts/*-smoke.js changes
#     (so we catch a broken smoke before merging into main's daily run)
#
# Failure semantics:
#   The orchestrator exits 1 on any smoke failure. This job goes red, the
#   GitHub UI shows which step exited, и с 27.08.2026 падение свипа заводит
#   задачу (одну открытую, с комментариями). До этого дня комментарий здесь
#   обещал ровно это, а шага не было — проверка краснела и не говорила никому.

name: Daily smoke

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "BASE URL for smokes (default ephemeral http://127.0.0.1:4001)"
        required: false
        default: "http://127.0.0.1:4001"
      read_only:
        description: "Only run read-only smokes (safe for prod)"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "aevion-globus-backend/scripts/*-smoke.js"
      - "aevion-globus-backend/scripts/all-smokes.js"
      - ".github/workflows/daily-smoke.yml"

# Без issues:write шаги «завести issue при красном свипе» падают с 403, то есть
# сторож, поставленный ради видимости отказа, сам отказывает невидимо. Добавлено
# 28.08.2026: шаги были написаны накануне, а прав им не дали — проверено против
# capability-truth-check.yml и founder-flow-nightly.yml, где эти права есть.
permissions:
  contents: read
  issues: write

jobs:
  daily-smoke:
    name: Daily smoke (ephemeral pg + backend)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aevion
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
    defaults:
      run:
        working-directory: aevion-globus-backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aevion
      JWT_SECRET: ci-smoke-jwt-secret-do-not-use-in-prod-32chars-min
      QSIGN_HMAC_V1_SECRET: ci-smoke-hmac-do-not-use-in-prod
      # Quantum Shield shard authentication — without this, /api/quantum-shield
      # create 500s ("SHARD_HMAC_SECRET_V1 env is not set"), reddening the whole
      # daily-smoke job on a fresh DB. Prod sets the real secret; CI uses a dummy.
      SHARD_HMAC_SECRET_V1: ci-smoke-shard-hmac-do-not-use-in-prod
      # Tier 3 amplifier ETag fingerprints depend on row counts, which
      # start at 0 in a fresh DB — that's fine for smoke shape checks.
      AWARDS_BACKDOOR: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: aevion-globus-backend/package-lock.json

      - name: Install backend deps
        run: npm install --ignore-scripts

      - name: Generate ephemeral Ed25519 key for QSign v2
        run: |
          PRIV=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
          echo "QSIGN_ED25519_V1_PRIVATE=$PRIV" >> $GITHUB_ENV

      - name: Build backend
        run: npm run build

      - name: Start backend (background)
        run: |
          node dist/index.js > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 60); do
            if curl -sSf http://127.0.0.1:4001/api/health >/dev/null 2>&1; then
              echo "backend ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend failed to start within 60s"
          tail -100 /tmp/backend.log
          exit 1

      - name: Run all smokes
        env:
          BASE: ${{ inputs.base_url || 'http://127.0.0.1:4001' }}
          READ_ONLY: ${{ inputs.read_only && '1' || '0' }}
          # qai / qfusionai hard-assert a live LLM provider (/chat 200, /route
          # 200). The ephemeral CI has no provider key, so they 500/503 and can
          # never pass here. They ARE covered against real prod by the
          # prod-readonly-sweep job below (where keys are configured). Skip in
          # the ephemeral run so a genuine regression elsewhere stays visible.
          SKIP: qai,qfusionai
        run: npm run smoke:all

      - name: Backend logs (always)
        if: always()
        run: tail -200 /tmp/backend.log || true

      - name: Stop backend
        if: always()
        run: kill $(cat /tmp/backend.pid) 2>/dev/null || true

  bank-prod-smoke:
    name: Bank prod smoke (Vercel → Railway)
    # Only run on cron and manual dispatch — skip on push triggers so we
    # don't hit prod on every commit.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aevion-globus-backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: aevion-globus-backend/package-lock.json

      - name: Install backend deps
        run: npm install --ignore-scripts

      - name: Run bank prod smoke
        run: node scripts/bank-prod-smoke.js
        env:
          # Default in the script already points to the Vercel rewrite URL.
          # Override with BASE secret to pin a stable prod URL if needed.
          BASE: ${{ secrets.BANK_PROD_SMOKE_BASE || '' }}
          ARTIFACT: /tmp/smoke-bank-prod-${{ github.run_id }}.json

      - name: Upload smoke artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bank-prod-smoke-${{ github.run_id }}
          path: /tmp/smoke-bank-prod-${{ github.run_id }}.json
          retention-days: 14

  hub-prod-smoke:
    name: Hub prod smoke (Railway /api/aevion/*)
    # Cron + manual dispatch only — no per-commit prod hits.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aevion-globus-backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: aevion-globus-backend/package-lock.json

      - name: Install backend deps
        run: npm install --ignore-scripts

      - name: Run hub prod smoke (incl. /sdks stats regression guard)
        run: node scripts/hub-full-smoke.js
        env:
          BASE: https://aevion-production-a70c.up.railway.app

  qbuild-prod-smoke:
    name: QBuild prod smoke (Vercel → Railway)
    # Cron + manual dispatch only — no per-commit prod hits.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aevion-globus-backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: aevion-globus-backend/package-lock.json

      - name: Install backend deps
        run: npm install --ignore-scripts

      - name: Run QBuild prod smoke
        run: node scripts/qbuild-prod-smoke.js
        env:
          # Default in the script already points at the Vercel rewrite URL.
          # Override with BASE secret to pin a stable prod URL if needed.
          BASE: ${{ secrets.QBUILD_PROD_SMOKE_BASE || '' }}
          ARTIFACT: /tmp/smoke-qbuild-prod-${{ github.run_id }}.json

      - name: Upload smoke artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qbuild-prod-smoke-${{ github.run_id }}
          path: /tmp/smoke-qbuild-prod-${{ github.run_id }}.json
          retention-days: 14

  constitution-prod-smoke:
    name: Constitution prod smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aevion-globus-backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: aevion-globus-backend/package-lock.json

      - name: Install backend deps
        run: npm install --ignore-scripts

      - name: Run Constitution prod smoke
        run: node scripts/constitution-prod-smoke.js
        env:
          BASE: ${{ secrets.CONSTITUTION_SMOKE_BASE || 'https://aevion.app/api-backend' }}
          SKIP_AI: "1"
          ARTIFACT: /tmp/constitution-smoke-${{ github.run_id }}.json

      - name: Upload smoke artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: constitution-prod-smoke-${{ github.run_id }}
          path: /tmp/constitution-smoke-${{ github.run_id }}.json
          retention-days: 30

  prod-readonly-sweep:
    name: Prod read-only smoke sweep (live Railway)
    # Cron + manual dispatch only — never on push. READ_ONLY=1 so it only runs
    # the safe read-only smokes and never writes to the live prod DB. Monitors
    # the whole public deploy (all modules) end-to-end, beyond just bank/hub.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aevion-globus-backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: aevion-globus-backend/package-lock.json

      - name: Install backend deps
        run: npm install --ignore-scripts

      # Two of the 45 smokes (qcore-fleet, qcore-autoroute) require compiled
      # modules — dist/services/qcoreai/{providers,orchestrator}.js. Without a
      # build they die instantly with `Cannot find module`, the orchestrator
      # exits 1, and the whole sweep goes red while 43 of 45 prod checks pass.
      #
      # Measured 2026-08-19: EVERY scheduled run of this workflow has failed —
      # 32 of 32 since it was created, zero successes. Push-triggered runs pass
      # 46 of 68 because they use the job above, which does build. So the daily
      # prod watchdog has never actually reported prod health; it reported a
      # missing build. Permanently red checks train people to stop looking.
      - name: Build backend (two smokes read from dist/)
        run: npm run build

      # tee the full output into a file AND fail on the orchestrator's exit
      # code (pipefail) — 2026-07-22 lesson: reading a truncated tail hid 10
      # failing scripts for a day. The artifact preserves every assertion line.
      - name: Read-only smoke sweep against live prod
        shell: bash
        run: |
          set -o pipefail
          BASE="$PROD_BASE" READ_ONLY=1 node scripts/all-smokes.js 2>&1 | tee prod-sweep-full.log
        env:
          PROD_BASE: ${{ secrets.PROD_SMOKE_BASE || 'https://aevion-production-a70c.up.railway.app' }}

      - name: Upload full sweep log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prod-readonly-sweep-log
          path: aevion-globus-backend/prod-sweep-full.log
          retention-days: 30

      # Отчёт о падении. До 27.08.2026 его НЕ БЫЛО: в шапке файла написано
      # «downstream issue creation is wired only on cron runs», а шага не
      # существовало — слово issue встречалось во всём файле ровно один раз,
      # в том самом комментарии. Ежедневная проверка 59 поверхностей прода
      # краснела и не говорила никому: красный прогон видит лишь тот, кто сам
      # зайдёт во вкладку Actions.
      #
      # Образец взят у capability-truth-check.yml, чтобы не заводить второй
      # способ сообщать об одном и том же: одна открытая задача с
      # комментариями, а не новая каждое утро.
      - name: Report a red prod sweep
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TAIL=$(tail -30 aevion-globus-backend/prod-sweep-full.log 2>/dev/null || echo "лог не сохранился")
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "Daily prod sweep is red in:title" --json number -q ".[0].number")
          BODY="Ежедневный свип прода упал.

          Прогон: $RUN_URL

          Хвост лога:

          $TAIL"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "🔴 Daily prod sweep is red" --body "$BODY"
          fi

      - name: Close the issue once the sweep is green again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "Daily prod sweep is red in:title" --json number -q ".[].number" |
            while read -r n; do
              [ -n "$n" ] && gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
                --comment "Свип снова зелёный: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            done
