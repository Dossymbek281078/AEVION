# CI для AEVION на GitLab.
#
# Зачем: пока аккаунт GitHub заблокирован, автоматических проверок нет вообще —
# ветка считается зелёной только потому, что кто-то прогнал тесты руками.
# 10.08.2026 это уже подвело: 438 тестов были зелёными при странице, которая
# вообще не компилировалась, и поймала это только сборка.
#
# ГЛАВНОЕ ЗДЕСЬ — блок workflow, а не сами тесты.
#
# Копия кода уезжает на GitLab автоматической синхронизацией, которая пушит
# ВСЕ ветки зеркала, а их 1120. Без ограничения каждая такая заливка запускала
# бы сотни пайплайнов разом: это и мгновенно сожгло бы бесплатные минуты, и
# со стороны выглядело бы ровно тем всплеском машинной активности, за который
# 27.07.2026 отключили аккаунт на GitHub. Второй раз наступать на это нельзя.
#
# Поэтому пайплайн запускается ТОЛЬКО на merge request и на ветке по
# умолчанию. Заливка резервных веток не порождает ни одного запуска.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

stages:
  - test

frontend-tests-and-build:
  stage: test
  image: node:22
  variables:
    # Без этого сборка падает на проверке типов:
    #   FATAL ERROR: Ineffective mark-compacts near heap limit
    #   Allocation failed - JavaScript heap out of memory
    # Компиляция проходит за 3.5 минуты, а `Running TypeScript` упирается в
    # стандартный потолок кучи Node (~2 ГБ). На моём ноутбуке памяти много и
    # сборка проходила, на раннере — нет: ещё один случай, когда «у меня
    # работает» ничего не доказывает про чужую машину.
    NODE_OPTIONS: "--max-old-space-size=6144"
  # ВЫНУЖДЕННО npm install, а не npm ci — обход настоящего дефекта, который
  # первый же прогон CI и вскрыл:
  #
  #   npm error `npm ci` can only install packages when your package.json and
  #   package-lock.json are in sync.
  #   Missing: @emnapi/runtime, @emnapi/core, @emnapi/wasi-threads, @swc/helpers
  #
  # Локфайл не покрывает Linux. На Windows `npm ci` проходит — там этих
  # пакетов не требуется, и npm отвечает «up to date», то есть увидеть поломку
  # локально нельзя по построению.
  #
  # ПОПЫТКА ПОЧИНИТЬ С WINDOWS НЕ УДАЛАСЬ, и это замеренный факт, а не
  # предположение: `npm install --package-lock-only` дописал @emnapi/core и
  # вложенный wasi-threads (+23 строки), после чего Linux всё равно отбил
  # установку. Значит локфайл надо пересобирать НА Linux и забирать
  # результат — иначе гарантия воспроизводимости не возвращается.
  #
  # До тех пор CI ставит install и честно пишет причину здесь.
  script:
    - cd frontend
    - npm install --no-audit --no-fund
    - npx vitest run
    # Сборка обязательна, одних тестов НЕ ХВАТАЕТ. Проверено 10.08.2026:
    # 438 тестов были зелёными дважды подряд при странице /pitch, которая
    # вообще не компилировалась (повторное объявление liveCount). Vitest
    # разбирает только то, что импортируют тестовые файлы, а продающие
    # страницы в тесты не входят — для них сборка единственная проверка.
    - npx next build
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules
  # Замеры: установка ~1 мин, тесты 8 с, сборка локально 10-11 мин на холодную.
  # Тридцати минут хватает с запасом; ограничение нужно, чтобы зависший прогон
  # не съедал минуты молча.
  timeout: 30 minutes
  interruptible: true

# Временная задача: показать, чего локфайлу не хватает ДЛЯ LINUX.
#
# Проблему видно только на Linux, а чинить её надо на Windows, где её не
# видно — замкнутый круг. Разрывается так: Linux сам пересобирает локфайл и
# ПЕЧАТАЕТ разницу в журнал. Скачивать артефакт не нужно, правку переношу
# руками по этому выводу.
#
# Задача не валит пайплайн (allow_failure) — она диагностическая, а не
# контрольная. Убрать, когда локфайл починен.
lockfile-linux-diff:
  stage: test
  image: node:22
  allow_failure: true
  script:
    - cd frontend
    - npm install --package-lock-only --no-audit --no-fund
    - echo "=== СТРОК ИЗМЕНИЛОСЬ ==="
    - git diff --stat package-lock.json
    - echo "=== ЧТО ДОБАВИЛ LINUX (имена пакетов) ==="
    - git diff -U0 package-lock.json | grep -E '^\+ +"node_modules/' | sed 's/[":]//g' | sort -u
    - echo "=== ПОЛНАЯ РАЗНИЦА ==="
    - git diff package-lock.json
  timeout: 10 minutes
  interruptible: true
