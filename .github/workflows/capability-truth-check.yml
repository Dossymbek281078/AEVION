name: Capability truth check

# /studio/capabilities decides "live" from the presence of an env var. On
# 2026-07-26 four capabilities were green while completely broken — image,
# video, voice and the aevion.build domain — and all four were found by hand.
# This calls the cheap end of each capability for real and fails when the shop
# window disagrees with reality.
#
# Expensive generators (image, video, 3D) are reported as "not probed" rather
# than assumed healthy: a daily paid generation is a cost decision.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *" # 12:00 Astana, after the morning deploys settle

permissions:
  contents: read
  issues: write

jobs:
  truth-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Compare declared capabilities with real calls
        id: check
        env:
          BASE: https://aevion.vercel.app
        run: node scripts/capability-truth-check.js | tee check.log

      - name: Report a capability that claims to work but does not
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # One open issue, commented on, rather than a new one every morning.
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "Capability claims live but fails in:title" --json number -q '.[0].number')
          BODY=$(printf 'A capability reports **live** while a real call to it fails.\n\nRun: %s\n\n```\n%s\n```' \
            "$RUN_URL" "$(tail -25 check.log 2>/dev/null || echo 'no log captured')")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "🟠 Capability claims live but fails when called" --body "$BODY"
          fi

      - name: Close the issue once every capability tells the truth again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "Capability claims live but fails in:title" --json number -q '.[].number' |
          while read -r n; do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
              --comment "Capabilities and reality agree again: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          done
