name: E2E (Playwright)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main, master]
    paths:
      - "frontend/e2e/**"
      - "frontend/playwright.config.ts"
      - "frontend/src/**"
      - ".github/workflows/e2e.yml"

# Расписание, о падении которого никто не узнаёт, работой не является.
# issues:write нужно шагам ниже; без него gh отвечает 403, и сторож отказывает
# невидимо — ровно это и случилось с daily-smoke.yml. 28.08.2026.
permissions:
  contents: read
  issues: write

jobs:
  e2e:
    name: Playwright Chromium
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          CI: "1"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Report a red run
        if: failure()
        uses: ./.github/actions/report-red-run
        with:
          title: "🔴 E2E (Playwright) is red"
          outcome: failure
          token: ${{ github.token }}

      - name: Clear the issue once green again
        if: success()
        uses: ./.github/actions/report-red-run
        with:
          title: "🔴 E2E (Playwright) is red"
          outcome: success
          token: ${{ github.token }}
