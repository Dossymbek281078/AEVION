# Council-vs-single-flagship quality benchmark (scripts/qcore-eval.js).
#
# Weekly cron + manual trigger. This is the first CI job that spends real LLM
# API money -- the job body is a no-op (see the `if:` guard below) until
# ANTHROPIC_API_KEY / OPENROUTER_API_KEY actually exist as repo secrets, so
# enabling the schedule here is safe even before those are provisioned.
#
# On a successful run it opens a PR with the refreshed docs/benchmarks/
# qcore-eval-latest.json (`latest` key only -- `historical` is untouched) so
# a human reviews the numbers before they land on main / the /qcoreai/vs page.

name: QCoreAI Council benchmark

on:
  workflow_dispatch:
    inputs:
      n:
        description: "Number of benchmark questions (max 40)"
        required: false
        default: "40"
  schedule:
    - cron: "0 3 * * 1" # Mon 03:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    name: Run qcore-eval.js + open a PR with fresh numbers
    runs-on: ubuntu-latest
    if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    defaults:
      run:
        working-directory: aevion-globus-backend
    env:
      NODE_ENV: test
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: aevion-globus-backend/package-lock.json

      - name: Install backend deps
        run: npm install --ignore-scripts

      - name: Build backend
        run: npm run build

      - name: Start backend (background)
        run: |
          node dist/index.js > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 60); do
            if curl -sSf http://127.0.0.1:4001/health >/dev/null 2>&1; then
              echo "backend ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend failed to start within 60s"
          tail -100 /tmp/backend.log
          exit 1

      - name: Run qcore-eval.js
        env:
          BASE: "http://127.0.0.1:4001"
          QCORE_EVAL_N: ${{ inputs.n || '40' }}
          QCORE_EVAL_PACE: "800"
        run: node scripts/qcore-eval.js

      - name: Stop backend
        if: always()
        run: kill $(cat /tmp/backend.pid) 2>/dev/null || true

      - name: Sync historical benchmark into frontend
        run: node scripts/sync-qcore-benchmark.js

      - name: Detect changes
        id: diff
        run: |
          cd ..
          git add docs/benchmarks/qcore-eval-latest.json frontend/src/app/qcoreai/vs/benchmark.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/qcore-benchmark-refresh
          delete-branch: true
          add-paths: |
            docs/benchmarks/qcore-eval-latest.json
            frontend/src/app/qcoreai/vs/benchmark.json
          # A weekly PR nobody is pinged for is a PR nobody reviews. Assign +
          # request review from the repo owner so it shows up in their
          # notifications instead of silently piling up.
          assignees: Dossymbek281078
          reviewers: Dossymbek281078
          commit-message: "chore(qcoreai): refresh Council-vs-flagship benchmark snapshot"
          title: "chore(qcoreai): refresh Council-vs-flagship benchmark snapshot"
          body: |
            Automated re-run of `scripts/qcore-eval.js` (N=${{ inputs.n || '40' }}).

            Only the `latest` key in `docs/benchmarks/qcore-eval-latest.json`
            changed -- `historical` is preserved untouched. Review the numbers
            before merging; if they've drifted meaningfully from the historical
            N=40 baseline, also update the prose in `orchestrator.ts` /
            `agents.ts` and `docs/benchmarks/README.md`.

            ⚙️ Generated by .github/workflows/qcore-benchmark.yml
