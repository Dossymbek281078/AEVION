# Быстрый gate: обе части стека собираются без ручных переключений папок.
# Backend matrix runs tsc *and* the integration suite so a regression in any
# of the bank-track routes (qtrade / ecosystem / cyberchess / planet payouts /
# qright royalties / metrics) lights the PR red.
name: CI

on:
  push:
    branches: [main, master, develop, bank-payment-layer]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (tsc + integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aevion-globus-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: aevion-globus-backend/package-lock.json
      - run: npm install --ignore-scripts
      - name: Prod env check (NODE_ENV=production guard)
        run: NODE_ENV=production node scripts/check-prod-env.js || true
      - name: projects↔pricing audit (catches missing MODULES_PRICING rows)
        run: npm run audit:projects-pricing
      - run: npm run build
      - run: npm test

  frontend:
    name: Frontend (next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --include=optional --no-audit --no-fund
      # Cheap script — fails the job if anyone adds an EN translation key
      # without ru/kk siblings. Prevents the silent English fallback that
      # PR #106 just spent 72 keys cleaning up.
      - name: i18n parity (en/ru/kk)
        working-directory: ${{ github.workspace }}
        run: node scripts/i18n-kk-extract.mjs
      # Линтер до 30.07.2026 не работал ВООБЩЕ (несовместимость eslint 10 с
      # eslint-plugin-react внутри eslint-config-next) и в CI не вызывался, поэтому
      # поломка была невидима. За один вечер после починки он нашёл семь дефектов,
      # которых не видят ни tsc, ни next build: Date.now() в рендере (расхождение
      # SSR и гидрации), <a> вместо Link на внутренних адресах (полная
      # перезагрузка вместо перехода), setState в теле эффекта.
      #
      # ПОЧЕМУ ПО КАТАЛОГАМ, а не `eslint src`: прогон по всему src падает с
      # крашем V8 — дерево src/app не влезает в память Node. Замерено 30.07.
      #
      # ПОЧЕМУ `|| true`: на момент включения накопленные ошибки не разобраны
      # (src/lib 3, src/components ~24, src/app частично). Ронять этим все PR
      # очереди нельзя — сначала пусть будет видно. Убрать `|| true` следующим
      # шагом, когда накопленное закрыто; иначе шаг превращается в украшение.
      - name: ESLint (по каталогам — полный прогон не влезает в память)
        run: |
          npx eslint src/lib || true
          npx eslint src/components || true
          npx eslint src/app/qbuild src/app/qventure src/app/fintech || true
      - run: npm run build

  payments-smoke:
    name: Payments Rail (api smoke)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --include=optional --no-audit --no-fund
      - run: npm run build
      - name: Start next server
        run: |
          npm start &
          echo $! > /tmp/next.pid
          for i in $(seq 1 40); do
            if curl -sSf http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              echo "next ready after ${i}s"
              break
            fi
            sleep 1
          done
      - name: Probe /api/health
        run: |
          curl -sSf http://127.0.0.1:3000/api/health | tee /tmp/health.json
          jq -e '.status == "ok"' /tmp/health.json
          jq -e '.version' /tmp/health.json
      - name: Probe /api/openapi.json
        run: |
          curl -sSf http://127.0.0.1:3000/api/openapi.json | jq -e '.openapi == "3.1.0"'
      - name: Auth gate (no token → 401)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/payments/v1/links)
          test "$code" = "401"
      - name: Create + read a link
        run: |
          KEY="sk_test_smoke$(date +%s)abc"
          curl -sSf -X POST http://127.0.0.1:3000/api/payments/v1/links \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d '{"amount":9900,"currency":"USD","title":"CI smoke"}' \
            | tee /tmp/link.json
          ID=$(jq -r .id /tmp/link.json)
          curl -sSf -H "Authorization: Bearer $KEY" \
            "http://127.0.0.1:3000/api/payments/v1/links/$ID" | jq -e '.status == "active"'
      - name: Audit captured the create
        run: |
          KEY="sk_test_smokeaudit$(date +%s)xyz"
          curl -sSf -X POST http://127.0.0.1:3000/api/payments/v1/links \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d '{"amount":4200,"currency":"EUR","title":"Audit probe"}' >/dev/null
          curl -sSf -H "Authorization: Bearer $KEY" \
            "http://127.0.0.1:3000/api/payments/v1/audit?action=link.created&limit=5" \
            | jq -e '.data | length >= 1'
      - name: Stop next server
        if: always()
        run: |
          kill $(cat /tmp/next.pid) 2>/dev/null || true
