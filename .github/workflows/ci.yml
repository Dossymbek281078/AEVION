# Быстрый gate: обе части стека собираются без ручных переключений папок.
# Backend matrix runs tsc *and* the integration suite so a regression in any
# of the bank-track routes (qtrade / ecosystem / cyberchess / planet payouts /
# qright royalties / metrics) lights the PR red.
name: CI

on:
  push:
    branches: [main, master, develop, bank-payment-layer]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (tsc + integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aevion-globus-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: aevion-globus-backend/package-lock.json
      - run: npm install --ignore-scripts
      - name: Prod env check (NODE_ENV=production guard)
        run: NODE_ENV=production node scripts/check-prod-env.js || true
      - name: projects↔pricing audit (catches missing MODULES_PRICING rows)
        run: npm run audit:projects-pricing
      - run: npm run build
      # Тесты и скрипты бэкенда сборка НЕ проверяет: include основного
      # конфига — только src/**. Замер 04.09.2026: 419 файлов тестов не
      # проверялись типами НИ РАЗУ, у скриптов тот же дефект нашли 19.08.
      # Обе команды зелёные на момент добавления; проверяются 404 файла из
      # 419, остаток — храповик в tsconfig.tests.json, он только укорачивается.
      - name: Test files type check (build covers src only)
        run: npm run check:tests
      - name: Scripts type check (build covers src only)
        run: npm run check:scripts
      # sdk/ — восемь клиентских библиотек, каждая со своим package.json и
      # полем "types". Публиковали обещание типов, не проверяя его: каталог
      # не входил ни в один конфиг репозитория.
      - name: SDK type check (build covers src only)
        run: npm run check:sdk
      - run: npm test
      # Сторожа модулей — чистый Node без зависимостей, поэтому шаг живёт здесь,
      # а не отдельной работой (working-directory возвращаем в корень репозитория).
      #
      # До 12.08.2026 их не запускал НИКТО: шесть проверок — карта разногласий
      # мультичата, чек, контраст модуля и три сторожа QReal — лежали в
      # репозитории и срабатывали, только если кто-то звал их руками. Сторож,
      # который не запускается, не сторожит: он не краснеет, когда поведение
      # уезжает, зато создаёт ощущение, что что-то проверяется.
      - name: Module guards (dissent map, receipt, contrast, QReal)
        working-directory: .
        run: npm run test:guards

  frontend:
    name: Frontend (next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --include=optional --no-audit --no-fund
      # Cheap script — fails the job if anyone adds an EN translation key
      # without ru/kk siblings. Prevents the silent English fallback that
      # PR #106 just spent 72 keys cleaning up.
      - name: i18n parity (en/ru/kk)
        working-directory: ${{ github.workspace }}
        run: node scripts/i18n-kk-extract.mjs
      # The suite existed and passed locally, but nothing ever executed it here:
      # this job used to go install → i18n → build and stop. 476 tests across 40
      # files gated exactly nothing, which is why pitchFacts could publish a
      # stale module count for months while a guard test written to catch that
      # very drift sat unrun. A test that is never invoked reads identically to
      # a test that passes.
      - name: Frontend unit tests
        run: npm run test -- --run
      # `next build` исключает *.test.ts — 242 файла тестов не проверялись
      # типами вовсе. Отдельным конфигом, а не снятием исключения: ошибка
      # типов в тесте иначе роняла бы боевую сборку и блокировала выкатку.
      - name: Test files type check (next build excludes tests)
        run: npm run typecheck:tests
      - run: npm run build

  payments-smoke:
    name: Payments Rail (api smoke)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --include=optional --no-audit --no-fund
      - run: npm run build
      - name: Start next server
        run: |
          npm start &
          echo $! > /tmp/next.pid
          for i in $(seq 1 40); do
            if curl -sSf http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              echo "next ready after ${i}s"
              break
            fi
            sleep 1
          done
      - name: Probe /api/health
        run: |
          curl -sSf http://127.0.0.1:3000/api/health | tee /tmp/health.json
          jq -e '.status == "ok"' /tmp/health.json
          jq -e '.version' /tmp/health.json
      - name: Probe /api/openapi.json
        run: |
          curl -sSf http://127.0.0.1:3000/api/openapi.json | jq -e '.openapi == "3.1.0"'
      - name: Auth gate (no token → 401)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/payments/v1/links)
          test "$code" = "401"
      - name: Create + read a link
        run: |
          KEY="sk_test_smoke$(date +%s)abc"
          curl -sSf -X POST http://127.0.0.1:3000/api/payments/v1/links \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d '{"amount":9900,"currency":"USD","title":"CI smoke"}' \
            | tee /tmp/link.json
          ID=$(jq -r .id /tmp/link.json)
          curl -sSf -H "Authorization: Bearer $KEY" \
            "http://127.0.0.1:3000/api/payments/v1/links/$ID" | jq -e '.status == "active"'
      - name: Audit captured the create
        run: |
          KEY="sk_test_smokeaudit$(date +%s)xyz"
          curl -sSf -X POST http://127.0.0.1:3000/api/payments/v1/links \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d '{"amount":4200,"currency":"EUR","title":"Audit probe"}' >/dev/null
          curl -sSf -H "Authorization: Bearer $KEY" \
            "http://127.0.0.1:3000/api/payments/v1/audit?action=link.created&limit=5" \
            | jq -e '.data | length >= 1'
      - name: Stop next server
        if: always()
        run: |
          kill $(cat /tmp/next.pid) 2>/dev/null || true
