# Быстрый gate: обе части стека собираются без ручных переключений папок.
# Backend matrix runs tsc *and* the integration suite so a regression in any
# of the bank-track routes (qtrade / ecosystem / cyberchess / planet payouts /
# qright royalties / metrics) lights the PR red.
name: CI

on:
  push:
    branches: [main, master, develop, bank-payment-layer]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (tsc + integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aevion-globus-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: aevion-globus-backend/package-lock.json
      - run: npm install --ignore-scripts
      - name: Prod env check (NODE_ENV=production guard)
        run: NODE_ENV=production node scripts/check-prod-env.js || true
      - name: projects↔pricing audit (catches missing MODULES_PRICING rows)
        run: npm run audit:projects-pricing
      - run: npm run build
      - run: npm test

  frontend:
    name: Frontend (next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --include=optional --no-audit --no-fund
      # Cheap script — fails the job if anyone adds an EN translation key
      # without ru/kk siblings. Prevents the silent English fallback that
      # PR #106 just spent 72 keys cleaning up.
      - name: i18n parity (en/ru/kk)
        working-directory: ${{ github.workspace }}
        run: node scripts/i18n-kk-extract.mjs
      # Sub-second per module, no install needed — reads the sources. Fails the
      # job when a call has no route behind it, or when one is addressed
      # relatively and so lands on the Next app instead of the backend. Both
      # used to fail into an empty catch and render a blank page, which is why
      # they went unnoticed for months.
      #
      # Listed here are the modules measured at zero findings on 2026-08-11.
      # Modules that still have findings are deliberately absent: a red job
      # nobody owns teaches people to ignore red jobs. Add a name here the day
      # its module reaches zero — `node scripts/api-contract-sweep.mjs` shows
      # where each stands.
      - name: API contract (frontend ↔ backend routes)
        working-directory: ${{ github.workspace }}
        run: |
          for m in build payments metrics veilnetx healthai cyberchess qjobs \
                   qsocial pipeline awards aev qgood qmaskcard ztide qchaingov \
                   search; do
            node scripts/build-contract-check.mjs --module=$m || exit 1
          done
      # The path can be right and the field names still disagree — that is how
      # the video-room invite ({ userId } vs req.body?.guestId) and the safety
      # briefing ({ checkedItemIds } vs items) both answered 400 into an empty
      # catch. QBuild only: it is the module whose api.ts declares its calls in
      # one place, which is what makes this checkable.
      - name: API request bodies (keys sent vs keys read)
        working-directory: ${{ github.workspace }}
        run: node scripts/api-body-check.mjs
      # Third of the same family: a key the client's type promises that the
      # handler never returns is undefined at runtime and renders as a blank,
      # not an error. Seven such lies were removed from api.ts before this was
      # gated; handlers that spread a DB row are skipped, not guessed at.
      - name: API responses (keys declared vs keys returned)
        working-directory: ${{ github.workspace }}
        run: node scripts/api-response-check.mjs
      - run: npm run build

  payments-smoke:
    name: Payments Rail (api smoke)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --include=optional --no-audit --no-fund
      - run: npm run build
      - name: Start next server
        run: |
          npm start &
          echo $! > /tmp/next.pid
          for i in $(seq 1 40); do
            if curl -sSf http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              echo "next ready after ${i}s"
              break
            fi
            sleep 1
          done
      - name: Probe /api/health
        run: |
          curl -sSf http://127.0.0.1:3000/api/health | tee /tmp/health.json
          jq -e '.status == "ok"' /tmp/health.json
          jq -e '.version' /tmp/health.json
      - name: Probe /api/openapi.json
        run: |
          curl -sSf http://127.0.0.1:3000/api/openapi.json | jq -e '.openapi == "3.1.0"'
      - name: Auth gate (no token → 401)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/payments/v1/links)
          test "$code" = "401"
      - name: Create + read a link
        run: |
          KEY="sk_test_smoke$(date +%s)abc"
          curl -sSf -X POST http://127.0.0.1:3000/api/payments/v1/links \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d '{"amount":9900,"currency":"USD","title":"CI smoke"}' \
            | tee /tmp/link.json
          ID=$(jq -r .id /tmp/link.json)
          curl -sSf -H "Authorization: Bearer $KEY" \
            "http://127.0.0.1:3000/api/payments/v1/links/$ID" | jq -e '.status == "active"'
      - name: Audit captured the create
        run: |
          KEY="sk_test_smokeaudit$(date +%s)xyz"
          curl -sSf -X POST http://127.0.0.1:3000/api/payments/v1/links \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d '{"amount":4200,"currency":"EUR","title":"Audit probe"}' >/dev/null
          curl -sSf -H "Authorization: Bearer $KEY" \
            "http://127.0.0.1:3000/api/payments/v1/audit?action=link.created&limit=5" \
            | jq -e '.data | length >= 1'
      - name: Stop next server
        if: always()
        run: |
          kill $(cat /tmp/next.pid) 2>/dev/null || true
