# AEVION — CI для GitLab. Перевод .github/workflows/ci.yml один в один.
#
# Зачем. Аккаунт GitHub приостановлен, проект переезжает на GitLab, а вместе с
# ним должен переехать гейт: правило «в main только через зелёный CI» иначе
# становится словами. Здесь повторены ровно те же три проверки, что и в
# ci.yml, теми же командами.
#
# ЧТО ЗДЕСЬ НЕ ПЕРЕНЕСЕНО (осознанно): девять остальных workflow —
# daily-smoke, e2e, lighthouse, constitution-smoke, founder-flow-nightly,
# mobile-sdks, post-merge-prod-check, qcore-benchmark, update-ksm. Они висят
# на schedule и бьют по ПРОДУ, а не по коду ветки. Переносить их стоит после
# того, как основной гейт заработает и переезд подтвердится — иначе одна
# ошибка в расписании начнёт долбить живой прод с нового раннера.
#
# Проверить локально, не дожидаясь GitLab:
#   powershell -File C:\Users\user\aevion-ci-local.ps1 -RepoPath <worktree>

stages:
  - build
  - smoke

default:
  image: node:24
  # Кэш общий на ветку: npm install в трёх job подряд иначе тянет всё заново.
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - aevion-globus-backend/node_modules/
      - frontend/node_modules/

# Гейт нужен на ветках, которые идут в main, и на самом main — как в ci.yml,
# где стоят push[main,master,develop] + pull_request.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "web"

backend:
  stage: build
  script:
    - cd aevion-globus-backend
    - npm install --ignore-scripts
    # `|| true` сохранён из ci.yml намеренно: проверка информационная и не
    # должна ронять пайплайн — она подсказывает, а не запрещает.
    - NODE_ENV=production node scripts/check-prod-env.js || true
    - npm run audit:projects-pricing
    - npm run build
    # ВАЖНО: тесты идут ПОСЛЕДОВАТЕЛЬНО (fileParallelism: false в
    # vitest.config.ts). При параллельном прогоне падали 4 файла из 91 —
    # они делят реестр модулей внутри воркера. Разбор и координаты для
    # настоящего лечения записаны в самом конфиге.
    - npm test

frontend:
  stage: build
  script:
    - cd frontend
    - npm install --include=optional --no-audit --no-fund
    # Ловит EN-ключ без ru/kk-пары — иначе перевод молча падает на английский.
    - cd "$CI_PROJECT_DIR" && node scripts/i18n-kk-extract.mjs
    # ESLint. До 30.07.2026 линтер не работал вовсе и в CI не вызывался, поэтому
    # поломка была невидима; после починки он сразу нашёл семь дефектов, невидимых
    # для tsc и next build. По каталогам — полный прогон падает с крашем V8
    # (src/app не влезает в память Node). Пока `|| true`: накопленное не разобрано,
    # ронять этим всю очередь нельзя. Снять, когда закрыто.
    - cd frontend
    - npx eslint src/lib || true
    - npx eslint src/components || true
    - npx eslint src/app/qbuild src/app/qventure src/app/fintech || true
    - npm run build

payments-smoke:
  stage: smoke
  needs: ["frontend"]
  script:
    - cd frontend
    - npm install --include=optional --no-audit --no-fund
    - npm run build
    - npm start & echo $! > /tmp/next.pid
    - |
      for i in $(seq 1 40); do
        if curl -sSf http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
          echo "next ready after ${i}s"; break
        fi
        sleep 1
      done
    - curl -sSf http://127.0.0.1:3000/api/health | tee /tmp/health.json
    - apt-get update -qq && apt-get install -y -qq jq
    - jq -e '.status == "ok"' /tmp/health.json
    - jq -e '.version' /tmp/health.json
  after_script:
    # Сервер надо гасить явно: незавершённый процесс держит job до таймаута.
    - if [ -f /tmp/next.pid ]; then kill "$(cat /tmp/next.pid)" 2>/dev/null || true; fi
