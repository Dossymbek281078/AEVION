# CI для AEVION на GitLab.
#
# Зачем: пока аккаунт GitHub заблокирован, автоматических проверок нет вообще —
# ветка считается зелёной только потому, что кто-то прогнал тесты руками.
# 10.08.2026 это уже подвело: 438 тестов были зелёными при странице, которая
# вообще не компилировалась, и поймала это только сборка.
#
# ГЛАВНОЕ ЗДЕСЬ — блок workflow, а не сами тесты.
#
# Копия кода уезжает на GitLab автоматической синхронизацией, которая пушит
# ВСЕ ветки зеркала, а их 1120. Без ограничения каждая такая заливка запускала
# бы сотни пайплайнов разом: это и мгновенно сожгло бы бесплатные минуты, и
# со стороны выглядело бы ровно тем всплеском машинной активности, за который
# 27.07.2026 отключили аккаунт на GitHub. Второй раз наступать на это нельзя.
#
# Поэтому пайплайн запускается ТОЛЬКО на merge request и на ветке по
# умолчанию. Заливка резервных веток не порождает ни одного запуска.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

stages:
  - test

frontend-tests-and-build:
  stage: test
  image: node:22
  variables:
    # Без этого сборка падает на проверке типов:
    #   FATAL ERROR: Ineffective mark-compacts near heap limit
    #   Allocation failed - JavaScript heap out of memory
    # Компиляция проходит за 3.5 минуты, а `Running TypeScript` упирается в
    # стандартный потолок кучи Node (~2 ГБ). На моём ноутбуке памяти много и
    # сборка проходила, на раннере — нет: ещё один случай, когда «у меня
    # работает» ничего не доказывает про чужую машину.
    NODE_OPTIONS: "--max-old-space-size=6144"
  # npm ci — строгая установка из локфайла, гарантия воспроизводимости.
  #
  # До 11.08.2026 здесь стоял install, потому что `npm ci` падал на Linux:
  # локфайл собирался на Windows и не содержал @emnapi/runtime,
  # @emnapi/core, @emnapi/wasi-threads и нужной версии @swc/helpers. Увидеть
  # это локально было нельзя по построению — на Windows эти пакеты не нужны,
  # и npm отвечает «up to date».
  #
  # Замкнутый круг разорван так: Linux сам пересобрал локфайл в CI и отдал его
  # артефактом. Результат строго ДОБАВЛЯЕТ 4 пакета и не убирает ни одного,
  # поэтому Windows ничего не теряет — проверено обеими установками:
  # `npm ci` на Windows 714 пакетов за 3 мин, тесты 439/439.
  script:
    - cd frontend
    - npm ci --no-audit --no-fund
    - npx vitest run
    # Сборка обязательна, одних тестов НЕ ХВАТАЕТ. Проверено 10.08.2026:
    # 438 тестов были зелёными дважды подряд при странице /pitch, которая
    # вообще не компилировалась (повторное объявление liveCount). Vitest
    # разбирает только то, что импортируют тестовые файлы, а продающие
    # страницы в тесты не входят — для них сборка единственная проверка.
    - npx next build
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules
  # Замеры: установка ~1 мин, тесты 8 с, сборка локально 10-11 мин на холодную.
  # Тридцати минут хватает с запасом; ограничение нужно, чтобы зависший прогон
  # не съедал минуты молча.
  timeout: 30 minutes
  interruptible: true
